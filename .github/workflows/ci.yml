name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: dotnet restore PbiAssure.slnx
      - run: dotnet build PbiAssure.slnx -c Release --no-restore
      - name: Install Playwright browsers for the privacy end-to-end tests
        run: tests/PbiAssure.Privacy.E2E/bin/Release/net10.0/playwright.ps1 install chromium
        shell: pwsh
      - run: dotnet test PbiAssure.slnx -c Release --no-build --logger "console;verbosity=minimal"
